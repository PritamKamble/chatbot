<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chatbot</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f3f5f9;
            color: #202534;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .chat {
            width: min(100%, 420px);
            height: min(680px, calc(100vh - 48px));
            min-height: 420px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            border: 1px solid #e5e8ef;
            border-radius: 18px;
            box-shadow: 0 16px 45px #25314d18;
        }
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 20px;
            color: #fff;
            background: #5856d6;
        }
        .avatar {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #ffffff2b;
            font-size: 20px;
        }
        header h1 { margin: 0; font-size: 16px; }
        header p { margin: 3px 0 0; color: #e2e1ff; font-size: 12px; }
        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            padding: 22px 18px;
            background: #fafbfe;
        }
        .message {
            max-width: 82%;
            padding: 11px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
        .bot { align-self: flex-start; border-bottom-left-radius: 5px; background: #eef0f6; }
        .user { align-self: flex-end; border-bottom-right-radius: 5px; color: #fff; background: #5856d6; }
        form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #edf0f5; }
        input {
            min-width: 0;
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #e1e5ed;
            border-radius: 12px;
            outline: none;
            font: inherit;
            font-size: 14px;
        }
        input:focus { border-color: #7775e2; box-shadow: 0 0 0 3px #5856d61a; }
        button {
            padding: 0 17px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            background: #5856d6;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #4644c2; }
        @media (max-width: 480px) {
            body { padding: 0; }
            .chat { width: 100%; height: 100vh; min-height: 0; border: 0; border-radius: 0; }
        }
    </style>
</head>
<body>
    <main class="chat" aria-label="Chat with assistant">
        <header>
            <div class="avatar" aria-hidden="true">✦</div>
            <div>
                <h1>Chat Assistant</h1>
                <p>Online · Ready to help</p>
            </div>
        </header>
        <section class="messages" id="messages" aria-live="polite" aria-label="Conversation">
            <div class="message bot">Hi there! 👋 How can I help you today?</div>
        </section>
        <form id="chat-form">
            <input id="message-input" type="text" placeholder="Type a message..." aria-label="Your message" autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </main>
    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');
        const messages = document.getElementById('messages');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            const bubble = document.createElement('div');
            bubble.className = 'message user';
            bubble.textContent = text;
            messages.appendChild(bubble);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
            input.focus();

            const reply = document.createElement('div');
            reply.className = 'message bot';
            reply.textContent = '...';
            messages.appendChild(reply);
            messages.scrollTop = messages.scrollHeight;

            try {
                const response = await fetch(`/chat/${encodeURIComponent(text)}`);
                if (!response.ok) throw new Error('Request failed');
                const data = await response.json();
                reply.textContent = data.response;
            } catch (error) {
                reply.textContent = 'Sorry, I could not reach the server. Please try again.';
            }
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
